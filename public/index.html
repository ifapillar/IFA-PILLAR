<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ifá Pillar — Links</title>
<meta name="theme-color" content="#1b120c" />
<meta name="description" content="Every link from the Ifá Pillar Empire in one place." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Karla:wght@400;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --clay: #1b120c; --clay-raised: #241710; --edge: #3d2a1d;
    --gold: #c8963e; --gold-soft: #d4a359; --bone: #f4efe6; --muted: #a2907c;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: radial-gradient(120% 80% at 50% -10%, #2c1c12 0%, var(--clay) 60%);
    color: var(--bone); font-family: Karla, system-ui, sans-serif;
    min-height: 100vh; padding: 48px 20px 64px;
  }
  .sheet { max-width: 560px; margin: 0 auto; }
  header { text-align: left; margin-bottom: 40px; }
  .mark { display: flex; gap: 6px; margin-bottom: 22px; }
  .mark i { width: 26px; height: 3px; background: var(--gold); border-radius: 2px; opacity: .85; }
  .mark i:nth-child(2) { opacity: .45; } .mark i:nth-child(4) { opacity: .45; }
  h1 { font-family: Fraunces, Georgia, serif; font-size: 2.4rem; font-weight: 600; line-height: 1.05; color: var(--gold-soft); }
  .tagline { color: var(--muted); margin-top: 10px; font-size: .95rem; letter-spacing: .01em; }
  ul { list-style: none; display: grid; gap: 12px; }
  a.link {
    display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 16px;
    background: var(--clay-raised); border: 1px solid var(--edge); border-radius: 14px;
    padding: 18px 20px; text-decoration: none; color: var(--bone);
    transition: transform .18s ease, border-color .18s ease, background .18s ease;
  }
  a.link:hover, a.link:focus-visible { transform: translateX(5px); border-color: var(--gold); background: #2b1c12; outline: none; }
  a.link.featured { border-color: var(--gold); background: linear-gradient(100deg, #33210f, var(--clay-raised)); }
  .title { display: block; font-weight: 600; font-size: 1.02rem; }
  .subtitle { display: block; color: var(--muted); font-size: .84rem; margin-top: 3px; }
  .arrow { color: var(--gold); font-family: Fraunces, serif; font-size: 1.2rem; }
  .state { border: 1px dashed var(--edge); border-radius: 14px; padding: 34px 24px; text-align: center; color: var(--muted); }
  .state strong { display: block; color: var(--bone); font-family: Fraunces, serif; font-size: 1.15rem; margin-bottom: 8px; }
  .skeleton { height: 70px; border-radius: 14px; background: var(--clay-raised); border: 1px solid var(--edge); animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .45; } }
  footer { margin-top: 42px; color: #6f6053; font-size: .78rem; }
  footer a { color: #6f6053; }
</style>
</head>
<body>
  <div class="sheet">
    <header>
      <div class="mark" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
      <h1>Ifá Pillar</h1>
      <p class="tagline">Ifá Pillar Tour to Kétou 2026 — every link in one place.</p>
    </header>

    <ul id="list" aria-busy="true">
      <li class="skeleton"></li><li class="skeleton"></li><li class="skeleton"></li>
    </ul>

    <footer><a href="/tour.html">The 4 Pillars workshop app</a></footer>
  </div>

<script type="module">
  const list = document.getElementById('list');

  const escape = (value) => String(value ?? '').replace(/[&<>"']/g, (c) =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);

  const render = (links) => {
    list.removeAttribute('aria-busy');
    if (!links.length) {
      list.innerHTML = `<li class="state"><strong>No links yet</strong>
        The hub is ready and waiting for its first destination.</li>`;
      return;
    }
    list.innerHTML = links.map((link) => `
      <li>
        <a class="link${link.featured ? ' featured' : ''}" href="${escape(link.url)}"
           target="_blank" rel="noopener noreferrer" data-id="${Number(link.id)}">
          <span>
            <span class="title">${escape(link.title)}</span>
            ${link.subtitle ? `<span class="subtitle">${escape(link.subtitle)}</span>` : ''}
          </span>
          <span class="arrow" aria-hidden="true">&#8599;</span>
        </a>
      </li>`).join('');
  };

  list.addEventListener('click', (event) => {
    const anchor = event.target.closest('a.link');
    if (anchor) navigator.sendBeacon(`/api/links/${anchor.dataset.id}/click`);
  });

  try {
    const response = await fetch('/api/links');
    if (!response.ok) throw new Error('unavailable');
    render(await response.json());
  } catch {
    list.removeAttribute('aria-busy');
    list.innerHTML = `<li class="state"><strong>Links unavailable</strong>
      The hub could not be reached just now. Please refresh in a moment.</li>`;
  }
</script>
</body>
</html>
